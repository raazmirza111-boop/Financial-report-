<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINANCIAL REPORT - SAHI JAMA MASJID</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#222;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.header{
  background:#7b1e1e;
  color:white;
  text-align:center;
  padding:18px 10px;
  border-radius:10px;
  margin-bottom:15px;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:bold;
}

.header h2{
  margin:7px 0;
  font-size:24px;
}

.header p{
  margin:4px 0;
  font-size:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
}

input,select,textarea,button{
  font-size:15px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border:1px solid #aaa;
  border-radius:6px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  padding:10px 14px;
  border:0;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.btn{
  background:#7b1e1e;
  color:white;
}

.btn2{
  background:#1d4ed8;
  color:white;
}

.btn3{
  background:#15803d;
  color:white;
}

.btn4{
  background:#b91c1c;
  color:white;
}

.btn5{
  background:#555;
  color:white;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.summaryBox{
  padding:15px;
  border-radius:8px;
  text-align:center;
  background:#eee;
}

.summaryBox h3{
  margin:0 0 8px;
}

.summaryBox strong{
  font-size:22px;
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  min-width:850px;
}

th,td{
  border:1px solid #777;
  padding:8px;
  text-align:left;
}

th{
  background:#ddd;
  text-align:center;
}

td.amount{
  text-align:right;
}

.actions{
  text-align:center;
  white-space:nowrap;
}

.empty{
  text-align:center;
  padding:25px;
  color:#666;
}

@media(max-width:800px){
  .filters{
    grid-template-columns:1fr 1fr;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:24px;
  }

  .header h2{
    font-size:20px;
  }
}

@media(max-width:500px){
  .filters{
    grid-template-columns:1fr;
  }

  .container{
    padding:8px;
  }

  button{
    width:100%;
    margin:4px 0;
  }
}

  .noPrint{
    display:none!important;
  }
